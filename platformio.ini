; PlatformIO Project Configuration File
; ESP32-S3 IoT Gateway for Cloud Grow System
;
; Hardware:
;   - ESP32-S3 1U-N4 (Dual-core Xtensa LX7 @240MHz)
;   - 8x Digital Input (optocoupler isolated)
;   - 8x Digital Output (Relay)
;   - 4x ADC (ADS1115, 16-bit)
;   - RS485 (ADUM 1201)
;   - Ethernet W5500

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Build flags for 4MB Flash
build_flags = 
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DESP32S3

; Board configuration for 4MB Flash
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_upload.flash_size = 4MB

; Library dependencies
lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit ADS1X15@^2.5.0
    arduino-libraries/Ethernet@^2.0.2
    tzapu/WiFiManager@^2.0.17
    Preferences
    SPI
    Update
    DNSServer

; File system for config storage
board_build.filesystem = littlefs
board_build.partitions = partitions_4mb.csv

; Serial monitor filters
monitor_filters = esp32_exception_decoder

[env:esp32-s3-debug]
extends = env:esp32-s3-devkitc-1
build_type = debug
build_flags = 
    ${env:esp32-s3-devkitc-1.build_flags}
    -DCORE_DEBUG_LEVEL=5

board_build.flash_size = 4MB
board_build.flash_mode = dio
board_upload.flash_size = 4MB
